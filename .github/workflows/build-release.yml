name: Build and Package

on:
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Get release information
        id: release-info
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            RELEASE_ID="${{ github.event.release.id }}"
          else
            # For manual dispatch, get the latest release
            TAG_NAME=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name')
            RELEASE_ID=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.id')
          fi
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "Tag name: $TAG_NAME"
          echo "Release ID: $RELEASE_ID"

      - name: Create build archive
        run: |
          cd build
          zip -r ../portfolio-build-${{ steps.release-info.outputs.tag_name }}.zip .
          cd ..
          
          # Verify the archive was created
          ls -la portfolio-build-*.zip

      - name: Upload build artifact to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.release-info.outputs.tag_name }}"
          ASSET_PATH="./portfolio-build-${TAG_NAME}.zip"
          ASSET_NAME="portfolio-build-${TAG_NAME}.zip"
          
          echo "Uploading $ASSET_NAME to release $TAG_NAME"
          
          # Upload using GitHub CLI
          gh release upload "$TAG_NAME" "$ASSET_PATH" --clobber
          
          echo "✅ Successfully uploaded build artifact to release"

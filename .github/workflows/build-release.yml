name: Build and Packageon:  release:    types: [created]permissions:  contents: writejobs:  build-and-upload:    runs-on: ubuntu-latest    steps:      - name: Checkout code        uses: actions/checkout@v4      - name: Setup Node.js        uses: actions/setup-node@v4        with:          node-version: '18'          cache: 'yarn'      - name: Install dependencies        run: yarn install --frozen-lockfile      - name: Build project        run: yarn build      - name: Create build archive        run: |          cd build          zip -r ../portfolio-build-${{ github.event.release.tag_name }}.zip .          cd ..      - name: Upload build artifact to release        uses: actions/upload-release-asset@v1        env:          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        with:          upload_url: ${{ github.event.release.upload_url }}          asset_path: ./portfolio-build-${{ github.event.release.tag_name }}.zip          asset_name: portfolio-build-${{ github.event.release.tag_name }}.zip          asset_content_type: application/zip
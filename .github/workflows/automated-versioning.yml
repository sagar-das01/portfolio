name: Automated Versioning and Releaseon:  pull_request:    types: [closed]    branches: [master]permissions:  contents: write  pull-requests: readjobs:  version-and-release:    if: github.event.pull_request.merged == true    runs-on: ubuntu-latest    steps:      - name: Checkout code        uses: actions/checkout@v4        with:          fetch-depth: 0          token: ${{ secrets.GITHUB_TOKEN }}      - name: Setup Node.js        uses: actions/setup-node@v4        with:          node-version: '18'          registry-url: 'https://registry.npmjs.org'      - name: Install dependencies        run: yarn install --frozen-lockfile      - name: Configure git        run: |          git config --local user.email "action@github.com"          git config --local user.name "GitHub Action"      - name: Determine version bump type        id: version-type        run: |          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"          echo "Branch name: $BRANCH_NAME"                    if [[ $BRANCH_NAME =~ ^(feature|feat)\/major\/.* ]]; then            echo "type=major" >> $GITHUB_OUTPUT            echo "Version bump: MAJOR"          elif [[ $BRANCH_NAME =~ ^(feature|feat)\/minor\/.* ]]; then            echo "type=minor" >> $GITHUB_OUTPUT            echo "Version bump: MINOR"          elif [[ $BRANCH_NAME =~ ^(fix|hotfix|bugfix)\/patch\/.* ]] || [[ $BRANCH_NAME =~ ^(feature|feat)\/patch\/.* ]]; then            echo "type=patch" >> $GITHUB_OUTPUT            echo "Version bump: PATCH"          elif [[ $BRANCH_NAME =~ ^release\/.* ]]; then            echo "type=release" >> $GITHUB_OUTPUT            echo "Version bump: RELEASE (no version change, just create release)"          else            echo "type=none" >> $GITHUB_OUTPUT            echo "No version bump - branch doesn't match versioning patterns"          fi      - name: Get current version        id: current-version        run: |          CURRENT_VERSION=$(node -p "require('./package.json').version")          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT          echo "Current version: $CURRENT_VERSION"      - name: Bump version        id: bump-version        if: steps.version-type.outputs.type != 'none' && steps.version-type.outputs.type != 'release'        run: |          npm version ${{ steps.version-type.outputs.type }} --no-git-tag-version          NEW_VERSION=$(node -p "require('./package.json').version")          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT          echo "New version: $NEW_VERSION"      - name: Commit version bump        if: steps.version-type.outputs.type != 'none' && steps.version-type.outputs.type != 'release'        run: |          git add package.json          git commit -m "chore: bump version to ${{ steps.bump-version.outputs.new }} [skip ci]"          git push origin master      - name: Create Git Tag        id: create-tag        if: steps.version-type.outputs.type != 'none'        run: |          if [ "${{ steps.version-type.outputs.type }}" = "release" ]; then            TAG_NAME="v${{ steps.current-version.outputs.current }}"          else            TAG_NAME="v${{ steps.bump-version.outputs.new }}"          fi                    echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT          git tag -a $TAG_NAME -m "Release $TAG_NAME"          git push origin $TAG_NAME          echo "Created tag: $TAG_NAME"      - name: Build project        if: steps.version-type.outputs.type != 'none'        run: |          yarn build      - name: Generate Release Notes        id: release-notes        if: steps.version-type.outputs.type != 'none'        run: |          PR_TITLE="${{ github.event.pull_request.title }}"          PR_BODY="${{ github.event.pull_request.body }}"          PR_NUMBER="${{ github.event.pull_request.number }}"          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"                    cat > release_notes.md << EOF          ## What's Changed                    **$PR_TITLE** (#$PR_NUMBER)                    ### Changes in this release:          $PR_BODY                    ### Branch Information:          - **Source Branch:** \`$BRANCH_NAME\`          - **Version Type:** \`${{ steps.version-type.outputs.type }}\`          - **Previous Version:** \`${{ steps.current-version.outputs.current }}\`          - **New Version:** \`${{ steps.create-tag.outputs.tag }}\`                    ---                    **Full Changelog:** https://github.com/${{ github.repository }}/compare/v${{ steps.current-version.outputs.current }}...${{ steps.create-tag.outputs.tag }}          EOF      - name: Create GitHub Release        if: steps.version-type.outputs.type != 'none'        uses: actions/create-release@v1        env:          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        with:          tag_name: ${{ steps.create-tag.outputs.tag }}          release_name: Release ${{ steps.create-tag.outputs.tag }}          body_path: release_notes.md          draft: false          prerelease: false      - name: Upload build artifacts to release        if: steps.version-type.outputs.type != 'none'        uses: actions/upload-release-asset@v1        env:          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        with:          upload_url: ${{ steps.create-release.outputs.upload_url }}          asset_path: ./build          asset_name: portfolio-build-${{ steps.create-tag.outputs.tag }}.zip          asset_content_type: application/zip        continue-on-error: true      - name: Summary        if: steps.version-type.outputs.type != 'none'        run: |          echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY          echo "" >> $GITHUB_STEP_SUMMARY          echo "- **Branch:** \`${{ github.event.pull_request.head.ref }}\`" >> $GITHUB_STEP_SUMMARY          echo "- **Version Type:** \`${{ steps.version-type.outputs.type }}\`" >> $GITHUB_STEP_SUMMARY          echo "- **Previous Version:** \`${{ steps.current-version.outputs.current }}\`" >> $GITHUB_STEP_SUMMARY          echo "- **New Version:** \`${{ steps.create-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY          echo "- **Release Created:** ✅" >> $GITHUB_STEP_SUMMARY          echo "" >> $GITHUB_STEP_SUMMARY          echo "### 📋 Next Steps:" >> $GITHUB_STEP_SUMMARY          echo "- Check the [Releases page](https://github.com/${{ github.repository }}/releases) for the new release" >> $GITHUB_STEP_SUMMARY          echo "- The GitHub Pages deployment will be triggered automatically" >> $GITHUB_STEP_SUMMARY      - name: No version bump needed        if: steps.version-type.outputs.type == 'none'        run: |          echo "## ℹ️ No Version Bump" >> $GITHUB_STEP_SUMMARY          echo "" >> $GITHUB_STEP_SUMMARY          echo "Branch \`${{ github.event.pull_request.head.ref }}\` doesn't match any versioning patterns." >> $GITHUB_STEP_SUMMARY          echo "" >> $GITHUB_STEP_SUMMARY          echo "### 📋 Supported Branch Patterns:" >> $GITHUB_STEP_SUMMARY          echo "- \`feature/major/*\` or \`feat/major/*\` → **Major** version bump" >> $GITHUB_STEP_SUMMARY          echo "- \`feature/minor/*\` or \`feat/minor/*\` → **Minor** version bump" >> $GITHUB_STEP_SUMMARY          echo "- \`feature/patch/*\`, \`feat/patch/*\`, \`fix/patch/*\`, \`hotfix/patch/*\`, \`bugfix/patch/*\` → **Patch** version bump" >> $GITHUB_STEP_SUMMARY          echo "- \`release/*\` → Create release from current version" >> $GITHUB_STEP_SUMMARY
name: Deploy to Google Cloud VM

on:
  workflow_run:
    workflows: ["Build and Package"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.2.3)'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production VM
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts

      - name: Prepare deployment variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # For workflow_run, get the release tag that triggered the build workflow
            echo "Getting version from workflow run context..."
            echo "Head branch: ${{ github.event.workflow_run.head_branch }}"
            echo "Head commit: ${{ github.event.workflow_run.head_sha }}"
            
            # Get the latest release tag
            VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
              jq -r '.tag_name // empty')
            
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "No releases found, checking for tags..."
              VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/tags" | \
                jq -r '.[0].name // empty')
            fi
            
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "❌ No version tags found in repository"
              exit 1
            fi
            
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [ "$VERSION" = "latest" ]; then
              echo "Resolving 'latest' to actual release tag..."
              # Get the actual latest release tag
              VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
                jq -r '.tag_name // empty')
              
              if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
                echo "No releases found, checking for latest tag..."
                VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "https://api.github.com/repos/${{ github.repository }}/tags" | \
                  jq -r '.[0].name // empty')
                
                if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
                  echo "❌ No releases or tags found and 'latest' was specified"
                  echo "Available options:"
                  echo "1. Create a release first"
                  echo "2. Specify an exact version tag"
                  exit 1
                fi
              fi
              echo "✅ Resolved 'latest' to version: $VERSION"
            else
              # Validate that the specified version exists
              echo "Validating specified version: $VERSION"
              RELEASE_CHECK=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION")
              
              if [ "$(echo "$RELEASE_CHECK" | jq -r '.message // empty')" = "Not Found" ]; then
                echo "❌ Specified version $VERSION not found"
                echo "Available releases:"
                curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "https://api.github.com/repos/${{ github.repository }}/releases" | \
                  jq -r '.[].tag_name' | head -5
                exit 1
              fi
              echo "✅ Version $VERSION found"
            fi
          else
            echo "❌ Unsupported event type: ${{ github.event_name }}"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Final version to deploy: $VERSION"

      - name: Check VM connectivity
        run: |
          ssh -o ConnectTimeout=30 -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} "echo 'VM connection successful'"

      - name: Transfer deployment scripts
        run: |
          # Create scripts directory on VM
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} "sudo mkdir -p /opt/portfolio-scripts"
          
          # Transfer all scripts and nginx config
          scp -i ~/.ssh/id_rsa scripts/*.sh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:/tmp/
          scp -i ~/.ssh/id_rsa nginx.conf ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:/tmp/
          
          # Move scripts to permanent location and set permissions
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} "
            sudo mv /tmp/*.sh /opt/portfolio-scripts/
            sudo chmod +x /opt/portfolio-scripts/*.sh
            sudo chown root:root /opt/portfolio-scripts/*.sh
          "

      - name: Check current deployment status
        id: current-status
        run: |
          CURRENT_VERSION=$(ssh -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} "
            if [ -f /var/www/portfolio/package.json ]; then
              grep '\"version\"' /var/www/portfolio/package.json | cut -d'\"' -f4
            else
              echo 'none'
            fi
          ")
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version on VM: $CURRENT_VERSION"

      - name: Wait for build artifacts and download
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          echo "Looking for build artifacts for version: $VERSION"
          
          # First, verify the release exists
          echo "Verifying release $VERSION exists..."
          RELEASE_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION")
          
          if [ "$(echo "$RELEASE_DATA" | jq -r '.message // empty')" = "Not Found" ]; then
            echo "❌ Release $VERSION not found"
            echo "Available releases:"
            curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases" | \
              jq -r '.[].tag_name' | head -5
            exit 1
          fi
          
          echo "✅ Release $VERSION found"
          
          # Wait up to 5 minutes for build artifacts to be available
          for i in {1..30}; do
            echo "Checking for build artifacts (attempt $i/30)..."
            
            # Get fresh release data
            RELEASE_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION")
            
            ASSET_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | contains("portfolio-build")) | .browser_download_url' | head -1)
            
            if [ "$ASSET_URL" != "null" ] && [ -n "$ASSET_URL" ] && [ "$ASSET_URL" != "" ]; then
              echo "✅ Build artifact found: $ASSET_URL"
              
              # Download the build artifact
              echo "Downloading build artifact..."
              curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "$ASSET_URL" -o "/tmp/portfolio-build-$VERSION.zip"
              
              # Verify download
              if [ -f "/tmp/portfolio-build-$VERSION.zip" ] && [ -s "/tmp/portfolio-build-$VERSION.zip" ]; then
                FILE_SIZE=$(ls -lh /tmp/portfolio-build-$VERSION.zip | awk '{print $5}')
                echo "✅ Build artifact downloaded successfully ($FILE_SIZE)"
                break
              else
                echo "❌ Downloaded file is empty or corrupted"
                rm -f "/tmp/portfolio-build-$VERSION.zip"
              fi
            else
              echo "Build artifact not yet available, waiting 10 seconds..."
              echo "Current assets in release $VERSION:"
              echo "$RELEASE_DATA" | jq -r '.assets[].name // "No assets found"'
              sleep 10
            fi
            
            if [ $i -eq 30 ]; then
              echo "❌ Timeout: Build artifact not found after 5 minutes"
              echo "Final check - Available assets in release $VERSION:"
              echo "$RELEASE_DATA" | jq -r '.assets[].name // "No assets found"'
              
              echo "All available releases:"
              curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases" | \
                jq -r '.[].tag_name' | head -10
              exit 1
            fi
          done

      - name: Backup current deployment
        if: steps.current-status.outputs.current != 'none'
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} "
            sudo mkdir -p /var/backups/portfolio
            if [ -d /var/www/portfolio ] && [ \"\$(ls -A /var/www/portfolio)\" ]; then
              sudo cp -r /var/www/portfolio /var/backups/portfolio/pre-${{ steps.vars.outputs.version }}-backup-\$(date +%Y%m%d-%H%M%S)
              echo 'Backup created successfully'
            fi
          "

      - name: Transfer and deploy new version
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          
          # Transfer the build artifact to VM
          scp -i ~/.ssh/id_rsa "/tmp/portfolio-build-$VERSION.zip" \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:/tmp/
          
          # Deploy on VM
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} "
            # Stop nginx service
            sudo systemctl stop nginx || true
            
            # Create backup of current deployment
            if [ -d /usr/share/nginx/html ] && [ \"\$(ls -A /usr/share/nginx/html 2>/dev/null)\" ]; then
              sudo mkdir -p /var/backups/nginx-html
              sudo cp -r /usr/share/nginx/html /var/backups/nginx-html/backup-\$(date +%Y%m%d-%H%M%S)
              echo 'Current deployment backed up'
            fi
            
            # Extract build files to temporary location
            cd /tmp
            sudo rm -rf /tmp/portfolio-extract
            sudo mkdir -p /tmp/portfolio-extract
            sudo unzip -o portfolio-build-$VERSION.zip -d /tmp/portfolio-extract
            
            # Clear nginx html directory and deploy new files
            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r /tmp/portfolio-extract/* /usr/share/nginx/html/
            
            # Set proper permissions
            sudo chown -R nginx:nginx /usr/share/nginx/html
            sudo chmod -R 755 /usr/share/nginx/html
            
            # Ensure index.html exists
            if [ ! -f /usr/share/nginx/html/index.html ]; then
              echo '❌ Error: index.html not found in deployment package'
              sudo ls -la /usr/share/nginx/html/
              exit 1
            fi
            
            # Update nginx configuration if needed
            sudo cp /tmp/nginx.conf /etc/nginx/conf.d/portfolio.conf 2>/dev/null || true
            
            # Test nginx configuration
            sudo nginx -t
            if [ \$? -ne 0 ]; then
              echo '❌ Nginx configuration test failed'
              exit 1
            fi
            
            # Start nginx service
            sudo systemctl start nginx
            sudo systemctl enable nginx
            
            # Clean up temporary files
            rm -f /tmp/portfolio-build-$VERSION.zip
            sudo rm -rf /tmp/portfolio-extract
            
            echo '✅ Deployment completed successfully'
            echo 'Files deployed to: /usr/share/nginx/html'
            sudo ls -la /usr/share/nginx/html/
          "

      - name: Verify deployment
        run: |
          # Wait for services to stabilize
          sleep 10
          
          # Check if the application is accessible
          VM_STATUS=$(ssh -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} "
            curl -f -s -o /dev/null -w '%{http_code}' http://localhost || echo 'failed'
          ")
          
          if [ "$VM_STATUS" = "200" ]; then
            echo "✅ Deployment verification successful"
            echo "Application is responding with HTTP 200"
          else
            echo "❌ Deployment verification failed"
            echo "HTTP Status: $VM_STATUS"
            exit 1
          fi

      - name: Get deployment info
        id: deployment-info
        run: |
          DEPLOYED_VERSION="${{ steps.vars.outputs.version }}"
          VM_IP="${{ secrets.GCP_VM_IP }}"
          
          echo "deployed_version=$DEPLOYED_VERSION" >> $GITHUB_OUTPUT
          echo "vm_ip=$VM_IP" >> $GITHUB_OUTPUT

      - name: Rollback on failure
        if: failure()
        run: |
          echo "🔄 Deployment failed, attempting rollback..."
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} "
            # Look for the most recent backup in nginx-html backups
            LATEST_BACKUP=\$(sudo ls -t /var/backups/nginx-html/ 2>/dev/null | head -n 1)
            if [ -n \"\$LATEST_BACKUP\" ]; then
              echo \"Rolling back to backup: \$LATEST_BACKUP\"
              sudo systemctl stop nginx || true
              sudo rm -rf /usr/share/nginx/html/*
              sudo cp -r /var/backups/nginx-html/\$LATEST_BACKUP/* /usr/share/nginx/html/
              sudo chown -R nginx:nginx /usr/share/nginx/html
              sudo chmod -R 755 /usr/share/nginx/html
              sudo systemctl start nginx
              echo \"Rollback completed\"
            else
              echo \"No nginx backup found for rollback\"
              echo \"Available backups:\"
              sudo ls -la /var/backups/ 2>/dev/null || echo \"No backup directories found\"
            fi
          "

      - name: Send deployment notification
        if: success()
        run: |
          echo "🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Deployed:** ${{ steps.vars.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous Version:** ${{ steps.current-status.outputs.current }}" >> $GITHUB_STEP_SUMMARY
          echo "- **VM IP:** ${{ steps.deployment-info.outputs.vm_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Access Links:" >> $GITHUB_STEP_SUMMARY
          echo "- **Production Site:** http://${{ steps.deployment-info.outputs.vm_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Page:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.version }}" >> $GITHUB_STEP_SUMMARY

      - name: Clean up SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
